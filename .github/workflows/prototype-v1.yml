name: Prototype V1

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "public/**"
      - "icm/instances/**"
      - "package.json"
      - ".github/workflows/prototype-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "public/**"
      - "icm/instances/**"
      - "package.json"
      - ".github/workflows/prototype-v1.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Verify runtime
        run: node --version
      - name: Run prototype contract tests
        run: npm test
